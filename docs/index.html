<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소싱 카탈로그 검색</title>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-title">
        <span class="logo">🔴</span>
        <h1>카탈로그 검색</h1>
      </div>
      <div class="header-meta">
        <span id="total-count">—</span>
        <span id="built-at">—</span>
        <button id="refresh-btn" class="refresh-btn" onclick="refreshIndex()">새로고침</button>
      </div>
    </header>

    <div class="search-box">
      <input
        id="search-input"
        type="text"
        placeholder="제품명 검색 (예: 고데기, 드라이기, 선풍기…)"
        autocomplete="off"
        autofocus
      />
      <span class="search-icon">🔍</span>
    </div>

    <div id="results-header" class="results-header hidden"></div>
    <div id="results" class="results"></div>

    <div id="empty-state" class="empty-state">
      <p>제품명을 검색해줘</p>
      <p class="sub">카탈로그 텍스트 전체에서 찾아줄게</p>
    </div>

    <div id="no-results" class="no-results hidden">
      <p>검색 결과 없어 🤔</p>
      <p class="sub">다른 키워드로 시도해봐</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
